name: Build APK

# =====================================================================
# Trigger: ทุกครั้งที่ push ขึ้น branch main หรือ master
# หรือสร้าง Release tag ก็จะ build เช่นกัน
# =====================================================================
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # ให้กด build เองด้วยมือจาก GitHub UI ได้

jobs:
  build:
    name: Build Debug APK
    # ubuntu-latest มี Android SDK pre-installed
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Setup JDK 17
      # AGP 8.3.x ต้องการ JDK 17 ขึ้นไป
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ---------------------------------------------------------------
      # 3. Setup Android SDK
      # ---------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------------
      # 4. Grant execute permission for gradlew
      # สำคัญมาก — ไฟล์ gradlew ต้องมี +x permission
      # ถ้าลืมขั้นตอนนี้ build จะ fail ด้วย "Permission denied"
      # ---------------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------------------------------------------------------------
      # 5. Cache Gradle dependencies
      # ลด build time จาก ~5 นาที เหลือ ~2 นาทีในการ build ครั้งถัดไป
      # ---------------------------------------------------------------
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------------------------------------------------------------
      # 6. Build Debug APK
      # assembleDebug = build APK แบบ debug (ไม่ต้อง sign key)
      # ---------------------------------------------------------------
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ---------------------------------------------------------------
      # 7. Upload APK as artifact
      # ผู้ใช้สามารถเปิด GitHub → Actions → workflow run → download APK
      # ---------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bank-amount-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # เก็บ artifact ไว้ 30 วัน (GitHub free plan)
          retention-days: 30

      # ---------------------------------------------------------------
      # 8. แสดง build info (optional แต่ useful)
      # ---------------------------------------------------------------
      - name: Show APK info
        run: |
          echo "===== BUILD SUCCESS ====="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "========================="
          echo "Download the APK from the 'Artifacts' section above"
